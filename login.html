<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Sign in — Last Tech</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      background: #e11d48;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 18px;
    }
    .logo-text {
      font-size: 20px;
      font-weight: 800;
    }
    .logo-text .black { color: #111; }
    .logo-text span { color: #e11d48; }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px 20px;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: #fafafa;
    }
    input:focus {
      border-color: #e11d48;
      background: #fff;
    }
    .btn {
      width: 100%;
      background: #e11d48;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:active { opacity: 0.9; }
    .links {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
    }
    .links a {
      color: #e11d48;
      text-decoration: none;
      font-weight: 600;
    }
    .divider {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <header>
    <a href="lasttech.html" class="logo">
      <div class="logo-icon">L</div>
      <div class="logo-text"><span class="black">Last</span><span>Tech</span></div>
    </a>
  </header>

  <div class="container">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue earning</p>

    <form onsubmit="login(event)">
      <div class="form-group">
        <label>Email or Phone</label>
        <input type="text" id="email" placeholder="you@example.com or 080..." required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>

    <div class="divider">or</div>

    <div class="links">
      Don't have an account? <a href="register.html">Create free account</a>
    </div>
  </div>

  <script>
    function login(e) {
      e.preventDefault();
      // Demo login - just redirect to dashboard
      localStorage.setItem('lt_logged_in', 'true');
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
